board: MKS-DLC32
name: MDR-41
meta: 2026, Paul Kutukov, MSU, mm = nm for 3000/mm grating

kinematics:
  Cartesian:

stepping:
  engine: I2S_STREAM
  idle_ms: 254
  pulse_us: 2
  dir_delay_us: 5
  disable_delay_us: 10
  segments: 6
axes:
  shared_stepper_disable_pin: I2SO.0
  x:
    steps_per_mm: 16000.00
    max_rate_mm_per_min: 180.000
    acceleration_mm_per_sec2: 5.000
    max_travel_mm: 300.000
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: false
      mpos_mm: 200.000
      feed_mm_per_min: 10.000
      seek_mm_per_min: 150.000
      settle_ms: 500
      seek_scaler: 1.100
      feed_scaler: 1.100

    motor0:
      limit_neg_pin: gpio.36:low
      hard_limits: true
      pulloff_mm: 3.000
      stepstick:
        step_pin: I2SO.1
        direction_pin: I2SO.2
  y:
    steps_per_mm: 16000.00
    max_rate_mm_per_min: 180.000
    acceleration_mm_per_sec2: 5.000
  z:
    steps_per_mm: 16000.00
    max_rate_mm_per_min: 180.000
    acceleration_mm_per_sec2: 5.000

i2so:
  bck_pin: gpio.16
  data_pin: gpio.21
  ws_pin: gpio.17

spi:
  miso_pin: gpio.12
  mosi_pin: gpio.13
  sck_pin: gpio.14

sdcard:
  cs_pin: gpio.15
  card_detect_pin: gpio.39
  
uart1:
  txd_pin: gpio.0
  rxd_pin: gpio.4
  baud: 115200
  mode: 8N1
  
uart_channel1:
  uart_num: 1
  message_level: info

control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN

macros:
  startup_line0:
  startup_line1:
  macro0:
  macro1:
  #These are examples
  macro2:
  macro3:

coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0

user_outputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN

start:
  must_home: false

